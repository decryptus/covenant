name: CertLord alert rules
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate rules and firing/resolution scenarios
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/examples/certlord:/rules:ro" -w /rules prom/prometheus:v3.5.0 check rules certlord.rules.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/examples/certlord:/rules:ro" -w /rules prom/prometheus:v3.5.0 test rules rules.test.yml
