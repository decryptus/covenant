name: Docker Hub

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test release selection
        run: python3 -m unittest discover -s .github/tests -v
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vX.Y.Z'; exit 1; }
          test "${TAG#v}" = "$(cat VERSION)"
          test "${TAG#v}" = "$(cat RELEASE)"
      - uses: docker/setup-buildx-action@v4
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: covenant:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the built image
        run: |
          docker run --rm --entrypoint python covenant:test -c 'import pyjq; assert pyjq.first(".value", {"value": 42}) == 42'
          docker run --rm --entrypoint python -v "$PWD/tests:/test/tests:ro" -v "$PWD/etc:/test/etc:ro" -w /test covenant:test -m unittest discover -s tests -v
          docker run --rm --entrypoint python -e EXPECTED_VERSION="$(cat VERSION)" covenant:test -c 'import os; from importlib.metadata import version; assert version("covenant") == os.environ["EXPECTED_VERSION"]'
          docker run --rm --entrypoint covenant covenant:test --help
      - name: Save tested image
        if: github.event_name == 'push'
        run: docker save covenant:test | gzip > "$RUNNER_TEMP/covenant-image.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tested-image
          path: ${{ runner.temp }}/covenant-image.tar.gz
          retention-days: 7

  publish:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: covenant-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release
        id: release
        shell: bash
        run: bash .github/scripts/select-release.sh
      - name: Check Docker Hub credentials
        if: steps.release.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$TOKEN" || { echo 'Configure the DOCKERHUB_TOKEN repository secret.'; exit 1; }
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: tested-image
          path: ${{ runner.temp }}
      - name: Load tested image
        if: steps.release.outputs.publish == 'true'
        run: docker load --input "$RUNNER_TEMP/covenant-image.tar.gz"
      - name: Log in to Docker Hub
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: decryptus
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create version tag
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$(git rev-parse HEAD)"
      - name: Publish versioned image
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker tag covenant:test "decryptus/covenant:${TAG#v}"
          docker tag covenant:test "decryptus/covenant:$TAG"
          docker push "decryptus/covenant:${TAG#v}"
          docker push "decryptus/covenant:$TAG"
