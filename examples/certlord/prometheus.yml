global:
  scrape_interval: 60s
  evaluation_interval: 60s
rule_files:
  - certlord.rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: covenant-certlord
    metrics_path: /metrics/certificates
    scrape_timeout: 25s
    static_configs:
      - targets: ['127.0.0.1:9118']
